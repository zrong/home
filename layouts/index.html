{{ define "main" }}
<div class="home-container">
  <div>
    <a href="/"><img class="avatar" src="{{ .Site.Params.avatar }}" alt="avatar" style="width:120px;height:120px;"></a>
    <h1 id="index-header-title">ZRONG's HOME</h1>
    <ul class="home-nav">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if strings.HasPrefix .URL "http" }} target="_blank"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </div>
</div>
<div class="home-beian">
  <a href="{{ .Site.Params.beianURL }}" target="_blank">{{ .Site.Params.beian }}</a>
</div>
{{ end }}
