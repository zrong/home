<div id="search-overlay" class="search-overlay">
  <div class="search-box">
    <div class="search-box-header">
      <span class="vp-icon vpi-search" style="width:16px;height:16px;flex-shrink:0;color:var(--text-muted);"></span>
      <input id="search-input" type="text" placeholder="搜索（博客 + 主页）..." autocomplete="off">
      <button id="search-close-btn" class="search-close-btn" title="关闭">
        <kbd>Esc</kbd>
      </button>
    </div>
    <div id="search-results" class="search-results"></div>
    <div class="search-footer">
      <div class="search-footer-item">
        <kbd class="search-kbd">↑</kbd>
        <kbd class="search-kbd">↓</kbd>
        <span>导航</span>
      </div>
      <div class="search-footer-item">
        <kbd class="search-kbd">↵</kbd>
        <span>选择</span>
      </div>
      <div class="search-footer-item">
        <kbd class="search-kbd">Esc</kbd>
        <span>关闭</span>
      </div>
    </div>
  </div>
</div>
